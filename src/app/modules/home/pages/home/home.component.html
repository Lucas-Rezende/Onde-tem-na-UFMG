<app-minimalist-navbar></app-minimalist-navbar>

<div class="video-wrapper">
  <video autoplay muted loop playsinline preload="metadata" poster="assets/images/ufmg/escola-veterinaria.jpg"
    class="bg-video">
    <source src="assets/videos/bg_pink_red.mp4" type="video/mp4">
  </video>
  <div class="video-overlay"></div>
</div>

<main class="hero-section d-flex flex-column align-items-center text-center">
  <div class="container overlay-content mt-5 mt-md-1 d-flex flex-column align-items-center">

    <span class="message-hero mb-3 fade-in-up">💵 Salve seu dinheiro!</span>

    <h1 class="title-hero text-black fade-in-up delay-1 mb-2">
      Onde tem
      <span class="d-block fw-normal fst-italic">na UFMG</span>
    </h1>

    <p class="secondary-message-hero lead text-black-50 mb-3 mx-auto fade-in-up delay-2">
      Descubra os estabelecimentos do campus da UFMG, compare os preços e faça a <b>melhor escolha!</b>
    </p>

    <div class="hero-actions d-flex flex-column flex-sm-row justify-content-center gap-3 mt-2 fade-in-up delay-3">
      <button (click)="GoTo('/lanchonetes')" class="btn btn-primary fw-semibold px-4">
        Conheça os locais
      </button>
      <button (click)="GoTo('/comparar-precos')" class="btn btn-secondary fw-semibold px-4 text-white">
        Comparar preços
      </button>
    </div>

    <div class="update-message mx-auto fade-in-up delay-3">
      <p class="m-0">
        📸 <b>Viu algum preço ou produto diferente em alguma lanchonete?</b> Nos ajude a manter tudo atualizado!
        Envie a foto do cardápio para
        <a href="mailto:ondetemufmg@gmail.com" class="fw-bold text-decoration-underline">ondetemufmg@gmail.com</a>
      </p>
    </div>

    <div class="hero-image-container fade-in-up delay-4">
      <img src="assets/images/ufmg/escola-veterinaria.jpg" class="img-fluid d-block mx-auto rounded-4"
        alt="Escola de Veterinária da UFMG">
    </div>

  </div>
</main>
