<main class="hero-section position-relative overflow-hidden d-flex justify-content-center text-center">
	<div class="container d-flex flex-column align-items-center position-relative z-2">

		<span class="message-hero d-inline-block fw-medium text-white fade-in-up">💵 Salve seu dinheiro!</span>

		<h1 class="title-hero text-white fade-in-up delay-1 m-0">
			Onde tem
			<span class="d-block fw-normal fst-italic">na UFMG</span>
		</h1>
		<p class="secondary-message-hero text-white mx-auto fade-in-up delay-2">
			Descubra os estabelecimentos do campus da UFMG, compare os preços e faça a <b>melhor escolha!</b>
		</p>
		<div class="d-flex flex-column flex-sm-row justify-content-center gap-2 fade-in-up delay-3">
			<button (click)="GoTo('/lanchonetes')" class="btn btn-primary fw-semibold px-4">
				Conheça os locais
			</button>
			<button (click)="GoTo('/comparar-precos')" class="btn btn-secondary fw-semibold px-4 text-white border-0">
				Comparar preços
			</button>
		</div>
		<div class="update-message mx-auto text-white fade-in-up delay-3">
			<p class="m-0">
				📸 <b>Viu algum preço ou produto diferente em alguma lanchonete?</b> Nos ajude a manter tudo atualizado!
				Envie a foto do cardápio para
				<a href="mailto:ondetemufmg@gmail.com"
					class="fw-bold text-white text-decoration-underline">ondetemufmg@gmail.com</a>
			</p>
		</div>
	</div>
	<div class="footer-landscape position-absolute bottom-0 start-0 w-100 z-1 pe-none">
		<picture>
			<source media="(max-width: 1100px)" srcset="assets/images/ufmg_praca_servicos_mobile.png">
			<img src="assets/images/ufmg_praca_servicos.png" alt="" class="d-block w-100">
		</picture>
	</div>
</main>
